name: ResuMate CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend-build:
    name: Frontend React Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd Client
          npm install

      - name: Build Frontend
        run: |
          cd Client
          npm run build

  backend-build:
    name: Backend Flask Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          cd server
          pip install -r requirements.txt

      - name: Backend Health Check
        run: |
          python -c "print('Flask backend workflow successful')"
